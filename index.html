]}</p></article>`).join('')}</div></div></section><section class="about-section" id="sobre"><div class="container about-grid"><div class="about-art"><div class="about-art-inner">${icon('wrench',90)}<span>AUTO MECÂNICA<br><b>GAÚCHO</b></span></div></div><div><span class="eyebrow">SOBRE NÓS</span><h2>Uma oficina da região do Pilarzinho</h2><p>Estamos em Curitiba para atender quem procura manutenção e reparação automotiva. Fale com a equipe e consulte o melhor caminho para seu veículo.</p><div class="about-highlight">${icon('check',22)} Atendimento presencial em Curitiba, PR</div><a href="tel:+554132354294" class="btn btn-primary">Fale com a oficina ${icon('arrow')}</a></div></div></section><section class="location-section" id="localizacao"><div class="container location-grid"><div><span class="eyebrow">ONDE ESTAMOS</span><h2>Venha nos visitar</h2><p>Rua Raposo Tavares, 1485<br>Pilarzinho • Curitiba – PR</p><p class="subtle-note">*Endereço, telefone e horários obtidos de cadastro público; confirmar antes da publicação.</p><a class="btn btn-outline" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=Rua+Raposo+Tavares+1485+Pilarzinho+Curitiba">${icon('pin')} Ver no mapa ${icon('arrow',15)}</a></div><div class="map-panel">${icon('pin',38)}<strong>Pilarzinho, Curitiba</strong><span>Rua Raposo Tavares, 1485</span></div></div></section></main><footer class="public-footer"><div class="container footer-inner"><span>© ${new Date().getFullYear()} Auto Mecânica Gaúcho • Curitiba – PR</span><span>Sistema interno: MecFluxo <button data-panel>Acessar ${icon('arrow',13)}</button></span></div></footer><button class="floating-preview" data-panel>${icon('clipboard',18)} Ver demonstração</button></div>`}
function orderCard(o){const v=vehicle(o.vehicleId),c=client(o.clientId);return `<button class="order-card" data-order="${esc(o.id)}"><div class="order-card-top"><span class="mono">OS #${o.number}</span>${badge(o.status)}</div><h3>${v?esc(v.brand+' '+v.model):'Veículo não localizado'} <span class="plate">${esc(v?.plate||'')}</span></h3><p>${esc(c?.name||'Cliente não localizado')}</p><p class="order-complaint">${esc(o.complaint)}</p><div class="order-card-foot"><span>${fmtDate(o.createdAt)}</span><span>${money(sum(o))} ${icon('chevron',15)}</span></div></button>`}
function dashboard(){let active=db.orders.filter(o=>!['entregue','cancelado'].includes(o.status)).length, waiting=db.orders.filter(o=>o.status==='aprovacao').length,ready=db.orders.filter(o=>o.status==='pronto').length;const cards=[['clipboard','blue','OS em aberto',active,'Atendimentos ativos'],['clock','amber','Aguardando aprovação',waiting,'Orçamentos pendentes'],['box','amber','Peças pendentes',pendingParts().length,'Compra, pesquisa ou retirada'],['check','mint','Prontos para entrega',ready,'Veículos finalizados']];return `<div class="page-heading"><div><span class="eyebrow">VISÃO GERAL</span><h1>Olá, equipe Gaúcho <span class="wave">✦</span></h1><p>Acompanhe os atendimentos e organize o dia na oficina.</p></div><button class="btn btn-primary main-action" data-go="nova-os">${icon('plus')} Nova ordem de serviço</button></div><div class="stats-grid">${cards.map(x=>`<div class="stat-card"><span class="stat-icon ${x[1]}">${icon(x[0],22)}</span><span>${x[2]}</span><strong>${x[3]}</strong><small>${x[4]}</small></div>`).join('')}</div><div class="quick-actions">${H('Acesso rápido','O que você deseja fazer agora?')}<div class="shortcut-grid">${[['nova-os','clipboard','Abrir uma OS'],['pecas','box','Peças e compras'],['novo-cliente','users','Novo cliente'],['novo-veiculo','car','Novo veículo']].map(x=>`<button data-go="${x[0]}"><span>${icon(x[1],22)}</span>${x[2]} ${icon('arrow',16)}</button>`).join('')}</div></div><div class="activity-section">${H('Peças que precisam de atenção','Acompanhe compras e retiradas',`<button class="link-button" data-go="pecas">Ver todas ${icon('arrow',16)}</button>`)}<div class="purchase-list">${pendingParts().slice(0,3).map(purchaseCard).join('')||'<p class="subtle-note">Nenhuma peça pendente.</p>'}</div></div><div class="activity-section">${H('Ordens recentes','O que está acontecendo na oficina',`<button class="link-button" data-go="ordens">Ver todas ${icon('arrow',16)}</button>`)}<div class="orders-grid">${db.orders.slice().sort((a,b)=>b.number-a.number).slice(0,4).map(orderCard).join('')}</div></div>`}
const searchBox=(placeholder)=>`<div class="list-toolbar"><label class="search-input">${icon('search')}<input id="live-search" value="${esc(search)}" placeholder="${placeholder}" aria-label="Pesquisar registros" autocomplete="off"></label></div>`;
function clients(){return `${H('Clientes','Encontre e gerencie os clientes da oficina',`<button class="btn btn-primary" data-go="novo-cliente">${icon('plus')} Adicionar</button>`)}${searchBox('Buscar por nome ou telefone')}<div class="entity-list">${db.clients.map(c=>`<div class="entity-row searchable" data-terms="${esc(c.name+' '+c.phone).toLowerCase()}"><span class="entity-icon">${icon('users',22)}</span><div class="entity-text"><strong>${esc(c.name)}</strong><span>${esc(c.phone||'Telefone não informado')} • ${db.vehicles.filter(v=>v.clientId===c.id).length} veículo(s)</span></div><button class="tiny-action" data-edit-client="${esc(c.id)}" aria-label="Editar cliente ${esc(c.name)}">Editar</button></div>`).join('')}</div>`}
function vehicles(){return `${H('Veículos','Histórico organizado pela placa',`<button class="btn btn-primary" data-go="novo-veiculo">${icon('plus')} Adicionar</button>`)}${searchBox('Buscar por placa, modelo ou cliente')}<div class="entity-list">${db.vehicles.map(v=>`<div class="entity-row searchable" data-terms="${esc(v.plate+' '+v.brand+' '+v.model+' '+(client(v.clientId)?.name||'')).toLowerCase()}"><span class="entity-icon">${icon('car',22)}</span><div class="entity-text"><strong>${esc(v.brand+' '+v.model)} <span class="plate">${esc(v.plate)}</span></strong><span>${esc(client(v.clientId)?.name||'Cliente não encontrado')} • ${esc(v.year||'Ano não informado')}</span></div><button class="tiny-action" data-edit-vehicle="${esc(v.id)}">Editar</button></div>`).join('')}</div>`}
function orders(){let cards=db.orders.filter(o=>filter==='todos'||filter===o.status).sort((a,b)=>b.number-a.number);return `${H('Ordens de serviço','Gerencie o andamento de cada atendimento',`<button class="btn btn-primary" data-go="nova-os">${icon('plus')} Nova OS</button>`)}${searchBox('Buscar placa, cliente ou número')}<div class="filter-row">${[['todos','Todas'],...statusList].map(x=>`<button data-filter="${x[0]}" class="${filter===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="orders-grid">${cards.map(o=>`<div class="searchable" data-terms="${esc(String(o.number)+' '+(client(o.clientId)?.name||'')+' '+(vehicle(o.vehicleId)?.plate||'')).toLowerCase()}">${orderCard(o)}</div>`).join('')}</div>${cards.length?'':`<div class="empty"><h3>Nenhuma OS encontrada</h3></div>`}`}
const field=(label,name,value='',type='text',required=false,extra='')=>`<label class="field"><span>${label}${required?' *':''}</span><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}></label>`;
function clientForm(edit=false){const c=edit?client(selectedId):null;return `<div class="form-page"><button class="back-link" data-go="clientes">${icon('back')} Voltar para clientes</button>${H(edit?'Editar cliente':'Novo cliente','Preencha o básico para começar o atendimento')}<form class="form-card" data-form="client"><div class="form-grid">${field('Nome completo','name',c?.name,'text',true,'minlength="2"')}${field('Telefone / WhatsApp','phone',c?.phone,'tel',true)}${field('E-mail','email',c?.email,'email')}</div><label class="field"><span>Observações</span><textarea name="notes" rows="3">${esc(c?.notes||'')}</textarea></label><div class="form-actions"><button type="button" class="btn btn-outline" data-go="clientes">Cancelar</button><button class="btn btn-primary">${icon('check')} ${edit?'Salvar alterações':'Salvar cliente'}</button></div></form></div>`}

function newOS(){return `<div class="form-page"><button class="back-link" data-go="ordens">${icon('back')} Voltar para ordens</button>${H('Abrir ordem de serviço','Registre a entrada do carro de forma rápida')}<div class="wizard-hint">${icon('check',20)} <span>Escolha o veículo e descreva o problema. O restante pode ser preenchido depois.</span></div><form class="form-card" data-form="order"><label class="field"><span>Veículo / cliente *</span><select name="vehicleId" required><option value="">Selecione um veículo</option>${db.vehicles.map(v=>`<option value="${esc(v.id)}">${esc(v.plate)} — ${esc(v.brand+' '+v.model)} • ${esc(client(v.clientId)?.name||'')}</option>`).join('')}</select></label><label class="field"><span>Relato do cliente *</span><textarea name="complaint" required rows="4" placeholder="Qual problema o cliente relatou?"></textarea></label><div class="form-grid">${field('Quilometragem atual','mileage','','number',false,'min="0"')}${field('Previsão de entrega','expectedAt','','date')}</div>${db.vehicles.length?'':'<p class="form-alert">Cadastre ao menos um veículo antes de abrir uma OS.</p>'}<div class="form-actions"><button type="button" class="btn btn-outline" data-go="ordens">Cancelar</button><button class="btn btn-primary" ${db.vehicles.length?'':'disabled'}>${icon('plus')} Abrir OS</button></div></form></div>`}
function orderDetail(){let o=db.orders.find(x=>x.id===selectedId);if(!o)return '<p>Ordem não encontrada.</p>';let v=vehicle(o.vehicleId),c=client(o.clientId);return `<div class="os-detail"><button class="back-link" data-go="ordens">${icon('back')} Voltar para ordens</button><div class="detail-top"><div><span class="eyebrow">ORDEM DE SERVIÇO</span><h1>OS #${o.number}</h1><p>Abertura em ${fmtDate(o.createdAt)}</p></div>${badge(o.status)}</div><div class="detail-layout"><div class="detail-column"><section class="detail-card"><h3>${icon('car')} Veículo e cliente</h3><div class="detail-pair"><span>Veículo</span><strong>${esc((v?.brand||'')+' '+(v?.model||''))}</strong></div><div class="detail-pair"><span>Placa</span><strong>${esc(v?.plate)}</strong></div><div class="detail-pair"><span>Cliente</span><strong>${esc(c?.name)}</strong></div><div class="detail-pair"><span>Quilometragem</span><strong>${esc(o.mileage)} km</strong></div></section><section class="detail-card"><h3>${icon('clipboard')} Atendimento</h3><form data-form="notes"><label class="field"><span>Queixa do cliente</span><textarea name="complaint" rows="3">${esc(o.complaint)}</textarea></label><label class="field"><span>Diagnóstico / constatação</span><textarea name="diagnostics" rows="3">${esc(o.diagnostics)}</textarea></label><label class="field"><span>Observações internas</span><textarea name="notes" rows="2">${esc(o.notes)}</textarea></label><button class="btn btn-outline">${icon('check')} Salvar atendimento</button></form></section><section class="detail-card"><h3>${icon('wrench')} Orçamento</h3><div class="quote-items">${o.items.map(x=>`<div class="quote-item"><div><strong>${esc(x.title)}</strong><small>${x.type==='peca'?'Peça':'Serviço'} • ${x.qty} × ${money(x.unitPrice)}</small></div><div><b>${money(x.qty*x.unitPrice)}</b><button data-remove-item="${esc(x.id)}" aria-label="Remover ${esc(x.title)}">×</button></div></div>`).join('')||'<p class="subtle-note">Nenhum item no orçamento.</p>'}</div><form data-form="item" class="quote-add"><input name="title" required placeholder="Descrição da peça ou serviço"><div class="quote-input-row"><select name="type"><option value="servico">Serviço</option><option value="peca">Peça</option></select><input name="qty" type="number" min="0.01" step="0.01" value="1" required aria-label="Quantidade"><input name="unitPrice" type="number" min="0" step="0.01" placeholder="Valor R$" required aria-label="Valor unitário"></div><button class="btn btn-outline">${icon('plus')} Adicionar item</button></form><div class="quote-total"><span>Total estimado</span><strong>${money(sum(o))}</strong></div></section><section class="detail-card"><h3>${icon('box')} Peças e compras desta OS</h3><div class="purchase-list">${db.purchases.filter(p=>p.orderId===o.id).map(purchaseCard).join('')||'<p class="subtle-note">Nenhuma solicitação cadastrada para esta OS.</p>'}</div><button class="btn btn-outline" style="margin-top:14px" data-new-purchase="${esc(o.id)}">${icon('plus')} Solicitar peça</button></section></div><aside class="detail-column"><section class="detail-card"><h3>${icon('arrow')} Fluxo do atendimento</h3><label class="field"><span>Status atual</span><select id="os-status">${statusList.map(s=>`<option value="${s[0]}" ${o.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></label><p class="subtle-note">A execução exige registro de aprovação prévia.</p></section><section class="detail-card"><h3>${icon('check')} Aprovação do orçamento</h3><label class="field"><span>Registro de aprovação</span><select id="os-approval"><option value="pendente" ${o.approval==='pendente'?'selected':''}>Pendente</option><option value="aprovado" ${o.approval==='aprovado'?'selected':''}>Aprovado manualmente</option><option value="recusado" ${o.approval==='recusado'?'selected':''}>Recusado</option></select></label><p class="subtle-note">Demonstração: este registro não é assinatura digital e não comprova consentimento do cliente.</p></section><section class="detail-card detail-tip">${icon('calendar',23)}<strong>Próxima etapa</strong><p>Registre orçamento, autorização, andamento e entrega. Dados fictícios são locais a este navegador.</p></section></aside></div></div>`}
function purchaseCard(p){const o=os(p.orderId),v=o?vehicle(o.vehicleId):null;return `<button class="purchase-card searchable" data-purchase="${esc(p.id)}" data-terms="${esc([p.partName,p.supplier,p.responsible,o?.number,v?.plate].join(' ').toLowerCase())}"><div class="purchase-card-top"><span class="purchase-card-icon">${icon('box',20)}</span>${purchaseBadge(p.status)}</div><strong>${esc(p.partName)}</strong><div class="purchase-meta">${icon('clipboard',14)} OS #${esc(o?.number||'—')} ${v?' • '+esc(v.plate):''}</div><div class="purchase-meta">${icon('pin',14)} ${esc(p.supplier||'Fornecedor ainda não definido')}</div><div class="purchase-footer"><span>${esc(p.quantity)} un. ${p.cost==null?' • Custo não informado':' • '+money(p.cost)}</span>${icon('chevron',17)}</div></button>`}
function purchases(){let options=[['pendentes','Pendentes'],['todas','Todas'],['recebidas','Recebidas']];let filtered=db.purchases.filter(p=>purchaseFilter==='todas'||(purchaseFilter==='pendentes'?!['recebida','cancelada'].includes(p.status):p.status==='recebida')).slice().sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));return `${H('Peças e compras','Da pesquisa até a chegada da peça à oficina',`<button class="btn btn-primary" data-new-purchase="">${icon('plus')} Nova solicitação</button>`)}<div class="parts-summary"><div><span>Peças pendentes</span><strong>${pendingParts().length}</strong></div><div><span>Aguardando retirada</span><strong>${db.purchases.filter(p=>['comprada','reservada'].includes(p.status)).length}</strong></div><div><span>Em retirada</span><strong>${db.purchases.filter(p=>p.status==='retirada').length}</strong></div></div>${searchBox('Peça, fornecedor, OS ou placa')}<div class="filter-row">${options.map(x=>`<button data-part-filter="${x[0]}" class="${purchaseFilter===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="purchase-list">${filtered.map(purchaseCard).join('')||'<div class="empty"><h3>Nenhum registro nesta etapa</h3><p>Cadastre uma solicitação vinculada à ordem de serviço.</p></div>'}</div><p class="subtle-note" style="margin-top:18px">O custo da peça é interno e não altera automaticamente o orçamento apresentado ao cliente.</p>`}

function purchaseDetail(){let p=purchase(selectedPurchaseId);if(!p)return '<div class="empty"><h3>Solicitação não encontrada</h3></div>';let o=os(p.orderId),v=o?vehicle(o.vehicleId):null;return `<div class="os-detail"><button class="back-link" data-go="pecas">${icon('back')} Voltar para peças</button><div class="detail-top"><div><span class="eyebrow">CONTROLE DE PEÇAS</span><h1>${esc(p.partName)}</h1><p>Quantidade: ${p.quantity} • OS #${esc(o?.number||'—')} ${v?' • '+esc(v.plate):''}</p></div>${purchaseBadge(p.status)}</div><div class="detail-layout"><div class="detail-column"><section class="detail-card"><h3>${icon('box')} Dados da compra ou pesquisa</h3><form data-form="purchase-edit"><div class="form-grid">${field('Descrição da peça','partName',p.partName,'text',true)}${field('Quantidade','quantity',String(p.quantity),'number',true,'min="1" step="1"')}${field('Fornecedor / autopeças','supplier',p.supplier)}${field('Endereço de retirada','address',p.address)}${field('Quem vai buscar','responsible',p.responsible)}${field('Custo total pago (R$)','cost',p.cost==null?'':String(p.cost),'number',false,'min="0" step="0.01"')}${field('Data prevista de retirada','expectedAt',p.expectedAt,'date')}</div><label class="field"><span>Observações e pesquisas</span><textarea name="notes" rows="4">${esc(p.notes)}</textarea></label><button class="btn btn-primary">${icon('check')} Salvar informações</button></form></section><section class="detail-card"><h3>${icon('clock')} Histórico da solicitação</h3><div class="purchase-timeline">${(p.history||[]).slice().reverse().map(h=>`<div><span class="timeline-dot"></span><strong>${esc(purchaseName(h.status))}</strong><small>${esc(new Date(h.at).toLocaleString('pt-BR'))}</small></div>`).join('')}</div></section></div><aside class="detail-column"><section class="detail-card"><h3>${icon('truck')} Andamento da peça</h3><label class="field"><span>Alterar situação</span><select id="purchase-status">${purchaseStatuses.map(x=>`<option value="${x[0]}" ${p.status===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><p class="subtle-note">Comprada = aguardando retirada. Em retirada = alguém está buscando. Recebida = já chegou à oficina.</p></section><section class="detail-card"><h3>${icon('clipboard')} Ordem vinculada</h3><div class="detail-pair"><span>OS</span><strong>#${esc(o?.number||'—')}</strong></div><div class="detail-pair"><span>Veículo</span><strong>${esc(v?.brand||'')} ${esc(v?.model||'')}</strong></div><div class="detail-pair"><span>Placa</span><strong>${esc(v?.plate||'—')}</strong></div><button class="btn btn-outline" data-linked-os="${esc(p.orderId)}">${icon('arrow')} Abrir OS</button></section><section class="detail-card detail-tip">${icon('box',21)}<strong>Compra não é orçamento</strong><p>Este valor representa custo de aquisição para a oficina; o preço para o cliente continua sendo definido na OS.</p></section></aside></div></div>`}
function settings(){return `${H('Configurações e dados','Ambiente demonstrativo da primeira versão')}<div class="settings-grid"><section class="detail-card"><h3>${icon('check')} Privacidade do protótipo</h3><p>Dados de exemplo salvos apenas neste navegador. Não há login, sincronização remota ou proteção adequada para dados reais. <strong>Não utilize informações pessoais verdadeiras.</strong></p></section><section class="detail-card"><h3>${icon('download')} Exportar demonstração</h3><p>Salve um JSON com os registros de teste inseridos neste navegador.</p><button class="btn btn-outline" data-export>${icon('download')} Exportar JSON</button></section><section class="detail-card"><h3>${icon('settings')} Restaurar exemplos</h3><p>Remove as alterações locais e repõe os exemplos fictícios.</p><button class="btn btn-outline" data-reset>Restaurar demonstração</button></section><section class="detail-card"><h3>${icon('home')} Página institucional</h3><p>Veja a apresentação pública da oficina.</p><button class="btn btn-outline" data-site>Ver site público</button></section></div>`}
const screens={dashboard,clientes:clients,veiculos:vehicles,ordens:orders,'novo-cliente':()=>clientForm(false),'editar-cliente':()=>clientForm(true),'novo-veiculo':()=>vehicleForm(false),'editar-veiculo':()=>vehicleForm(true),'nova-os':newOS,'os-detalhe':orderDetail,pecas:purchases,'nova-peca':purchaseForm,'peca-detalhe':purchaseDetail,sobre:settings};
function adminPage(){let nav=[['dashboard','home','Início'],['ordens','clipboard','Ordens'],['clientes','users','Clientes'],['veiculos','car','Veículos'],['pecas','box','Peças e compras']];let labels={dashboard:'Visão geral',clientes:'Clientes',veiculos:'Veículos',ordens:'Ordens de serviço','novo-cliente':'Novo cliente','novo-veiculo':'Novo veículo','nova-os':'Nova ordem','os-detalhe':'Detalhes da OS',pecas:'Peças e compras','nova-peca':'Nova solicitação','peca-detalhe':'Detalhe da peça',sobre:'Configurações'};return `<div class="app-shell"><aside class="sidebar"><div class="sidebar-brand">${mk()}<div><strong>MecFluxo</strong><span>Auto Mecânica Gaúcho</span></div></div><div class="workspace-label">ÁREA DE TRABALHO</div><div class="side-nav">${nav.map(n=>`<button class="${screen===n[0]?'active':''}" data-go="${n[0]}">${icon(n[1],19)} ${n[2]}</button>`).join('')}</div><div class="sidebar-bottom"><button data-go="sobre">${icon('settings')} Configurações</button><button data-site>${icon('arrow')} Ver site público</button><div class="sidebar-mini"><span class="avatar">AG</span><div><strong>Ambiente demonstrativo</strong><small>Dados locais • sem autenticação</small></div></div></div></aside><div class="app-main"><div class="topbar"><div class="topbar-heading"><span class="mobile-app-name">${mk()} MecFluxo</span><span class="desktop-app-name">Painel de gestão ${icon('chevron',15)} <strong>${labels[screen]||'Visão geral'}</strong></span></div><div class="topbar-actions"><span class="badge badge-orange">MODO DEMO</span><span class="avatar">AG</span></div></div><main class="app-content">${(screens[screen]||dashboard)()}</main></div><nav class="bottom-nav"><button class="${screen==='dashboard'?'active':''}" data-go="dashboard">${icon('home',21)}Início</button><button class="${screen==='ordens'||screen==='os-detalhe'?'active':''}" data-go="ordens">${icon('clipboard',21)}Ordens</button><button class="bottom-add" data-go="nova-os" aria-label="Nova ordem de serviço">${icon('plus',25)}</button><button class="${screen==='clientes'?'active':''}" data-go="clientes">${icon('users',21)}Clientes</button><button class="${['pecas','nova-peca','peca-detalhe'].includes(screen)?'active':''}" data-go="pecas">${icon('box',21)}Peças</button></nav><div class="demo-disclaimer">${icon('check',14)} Protótipo: sem autenticação ou banco remoto</div></div>`}
function render(){document.getElementById('app').innerHTML=area==='site'?publicPage():adminPage();filterSearch()}
function filterSearch(){document.querySelectorAll('.searchable').forEach(el=>{el.style.display=(el.dataset.terms||'').includes(search.toLowerCase())?'':'none'})}
function dataValues(form){return Object.fromEntries(new FormData(form).entries())}
function submit(form){let d=dataValues(form),now=new Date().toISOString();if(form.dataset.form==='client'){
  if(String(d.name).trim().length<2||!String(d.phone).trim())return flash('Informe nome e telefone válidos');
  if(screen==='editar-cliente'){let c=client(selectedId);if(c)Object.assign(c,{name:d.name.trim(),phone:d.phone.trim(),email:d.email.trim(),notes:d.notes.trim()})}
  else db.clients.unshift({id:id(),name:d.name.trim(),phone:d.phone.trim(),email:d.email.trim(),notes:d.notes.trim(),createdAt:now});
  persist();go('clientes');flash('Cliente salvo com sucesso');return;
}if(form.dataset.form==='vehicle'){
  let plate=String(d.plate).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(plate))return flash('Informe uma placa brasileira válida, como ABC1D23');
  if(db.vehicles.some(v=>v.plate===plate&&(screen!=='editar-veiculo'||v.id!==selectedId)))return flash('Essa placa já está cadastrada');
  if(!client(d.clientId))return flash('Selecione um cliente válido');
  let entry={clientId:d.clientId,plate,brand:d.brand.trim(),model:d.model.trim(),year:d.year.trim(),mileage:d.mileage.trim()};
  if(screen==='editar-veiculo'){let v=vehicle(selectedId);if(v)Object.assign(v,entry)}else db.vehicles.unshift({id:id(),...entry,createdAt:now});
  persist();go('veiculos');flash('Veículo salvo com sucesso');return;
}if(form.dataset.form==='order'){
  let v=vehicle(d.vehicleId);if(!v||!String(d.complaint).trim())return flash('Selecione veículo e descreva o problema');
  let next=Math.max(1000,...db.orders.map(o=>o.number))+1;
  let o={id:id(),number:next,clientId:v.clientId,vehicleId:v.id,complaint:d.complaint.trim(),diagnostics:'',status:'recebido',mileage:d.mileage||v.mileage,expectedAt:d.expectedAt||'',createdAt:now,items:[],approval:'pendente',notes:''};
  db.orders.unshift(o);persist();selectedId=o.id;go('os-detalhe');flash(`OS #${next} aberta com sucesso`);return;
}if(form.dataset.form==='purchase'||form.dataset.form==='purchase-edit'){
  const edit=form.dataset.form==='purchase-edit',p=edit?purchase(selectedPurchaseId):null;
  const orderId=edit?p?.orderId:d.orderId,order=os(orderId);
  let qty=Number(d.quantity),cost=String(d.cost).trim()===''?null:Number(d.cost);
  if(!order)return flash('Selecione uma ordem de serviço válida');
  if(!String(d.partName).trim()||!Number.isInteger(qty)||qty<1||cost!==null&&(!Number.isFinite(cost)||cost<0))return flash('Verifique a descrição, quantidade e custo');
  let patch={partName:d.partName.trim(),quantity:qty,supplier:d.supplier.trim(),address:d.address.trim(),responsible:d.responsible.trim(),cost,expectedAt:d.expectedAt||'',notes:d.notes.trim(),updatedAt:now};
  if(edit){if(!p)return flash('Solicitação não encontrada');Object.assign(p,patch);persist();go('peca-detalhe');flash('Informações da peça atualizadas');}
  else{let status=purchaseStatuses.some(x=>x[0]===d.status)?d.status:'pesquisando';let created={id:id(),orderId,...patch,status,createdAt:now,history:[{at:now,status}]};db.purchases.unshift(created);selectedPurchaseId=created.id;prefillOrderId='';persist();go('peca-detalhe');flash('Solicitação de peça cadastrada');}return;
}if(form.dataset.form==='notes'){
  let o=db.orders.find(x=>x.id===selectedId);if(!o)return;
  o.complaint=d.complaint.trim();o.diagnostics=d.diagnostics.trim();o.notes=d.notes.trim();persist();flash('Atendimento atualizado');return;
}if(form.dataset.form==='item'){
  let o=db.orders.find(x=>x.id===selectedId);if(!o)return;
  let qty=Number(d.qty),price=Number(d.unitPrice);
  if(!d.title.trim()||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0)return flash('Confira os dados do orçamento');
  o.items.push({id:id(),title:d.title.trim(),type:d.type==='peca'?'peca':'servico',qty,unitPrice:price});o.approval='pendente';if(['execucao','pronto','entregue'].includes(o.status))o.status='aprovacao';persist();render();flash('Item incluído; aprovação redefinida para pendente');
}}
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();submit(f)}});
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-order]');if(!t)return;
 if(t.hasAttribute('data-panel')){panel();return}if(t.hasAttribute('data-site')){site();return}
 if(t.hasAttribute('data-menu')){document.getElementById('publicNav')?.classList.toggle('open');return}
 if(t.hasAttribute('data-new-purchase')){prefillOrderId=t.dataset.newPurchase||'';go('nova-peca');return}
 if(t.dataset.purchase){selectedPurchaseId=t.dataset.purchase;go('peca-detalhe');return}
 if(t.dataset.linkedOs){selectedId=t.dataset.linkedOs;go('os-detalhe');return}
 if(t.dataset.partFilter){purchaseFilter=t.dataset.partFilter;render();return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.order){selectedId=t.dataset.order;go('os-detalhe');return}
 if(t.dataset.editClient){selectedId=t.dataset.editClient;go('editar-cliente');return}
 if(t.dataset.editVehicle){selectedId=t.dataset.editVehicle;go('editar-veiculo');return}
 if(t.dataset.filter){filter=t.dataset.filter;render();return}
 if(t.dataset.removeItem){const o=db.orders.find(x=>x.id===selectedId);if(!o)return;o.items=o.items.filter(x=>x.id!==t.dataset.removeItem);o.approval='pendente';if(['execucao','pronto','entregue'].includes(o.status))o.status='aprovacao';persist();render();flash('Item removido; revisar aprovação');return}
 if(t.hasAttribute('data-reset')){if(confirm('Restaurar a demonstração? Cadastros realizados neste navegador serão descartados.')){db=structuredClone(seed);persist();go('dashboard');flash('Dados fictícios restaurados')}return}
 if(t.hasAttribute('data-export')){const b=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='mecfluxo-dados-demonstracao.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);flash('Dados exportados');return}
});
document.addEventListener('input',e=>{if(e.target.id==='live-search'){search=e.target.value;filterSearch()}});
document.addEventListener('change',e=>{
 if(e.target.id==='purchase-status') {const p=purchase(selectedPurchaseId);if(!p)return;let status=e.target.value;if(!purchaseStatuses.some(x=>x[0]===status))return;p.status=status;p.updatedAt=new Date().toISOString();p.history=[...(p.history||[]),{at:p.updatedAt,status}];persist();render();flash('Situação da peça atualizada');return}
 const o=db.orders.find(x=>x.id===selectedId);if(!o)return;
 if(e.target.id==='os-approval'){o.approval=e.target.value;if(o.approval!=='aprovado'&&['execucao','pronto','entregue'].includes(o.status))o.status='aprovacao';persist();render();flash('Autorização de teste atualizada')}
 if(e.target.id==='os-status'){
  if(['execucao','pronto','entregue'].includes(e.target.value)&&o.approval!=='aprovado'){render();flash('Registre a aprovação antes de iniciar ou concluir o serviço');return}
  o.status=e.target.value;if(o.status==='entregue')o.completedAt=new Date().toISOString();persist();render();flash('Etapa atualizada')
 }
});
render();
</script></body></html>
